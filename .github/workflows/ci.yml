name: CI

on:
  push:
    branches: [main, 'v2/**']
  pull_request:
    branches: [main, 'v2/**']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Lint de formato (Prettier)
        run: npm run format:check

      - name: Typecheck (TypeScript)
        run: npm run typecheck

      - name: Testes unitários e de componente (Vitest)
        run: npm test

      - name: Build de produção
        run: npm run build
