<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#115e59" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#134e4a" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Afetivo" />
    <title>Afetivo - Diário de Humor &amp; Padrões Emocionais</title>
    <meta
      name="description"
      content="Sistema pessoal de registro de humor, emoções, comportamentos impulsivos, sono e rotina com análise de padrões e estratégias de autorregulação."
    />
    <meta property="og:title" content="Afetivo - Diário de Humor & Padrões Emocionais" />
    <meta
      property="og:description"
      content="Sistema pessoal de registro de humor, emoções, comportamentos impulsivos, sono e rotina com análise de padrões e estratégias de autorregulação."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Aplica o tema antes da primeira pintura para evitar flash (FOUC).
      (function () {
        try {
          var stored = localStorage.getItem('afetivo_theme');
          var dark = stored
            ? stored === 'dark'
            : matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          /* tema padrão do sistema */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
